<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tuniefy</title>
  <meta name="theme-color" content="#0d9488" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0fdfa;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 28px 22px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 12px 30px rgba(13, 148, 136, 0.12);
    }
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #0d9488;
      color: #ffffff;
      font-weight: 800;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 20px; font-size: 13px; color: #64748b; line-height: 1.5; }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 14px;
      background: #0d9488;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">T</div>
    <h1>Tuniefy</h1>
    <p>Internet connection check karein aur dobara try karein.</p>
    <button onclick="window.location.href='https://tuniefy.vercel.app/'">Retry Connection</button>
  </div>
</body>
</html>
